name: 주간 데이터 갱신

on:
  schedule:
    # 추첨은 토 20:45 KST. 그때부터 당첨번호를 빨리 잡는 것이 목적이다.
    # 일요일 새벽에 한 번만 돌리면 토요일 밤에 확인하려는 사용자를 놓친다.
    #
    # 토 12:00~13:59 UTC = 21:00~22:59 KST, 20분 간격
    - cron: '*/20 12-13 * * 6'
    # 일 00:00·03:00 UTC = 09:00·12:00 KST.
    # 당첨금과 1등 판매점은 추첨 직후엔 확정되지 않아 나중에 채워진다.
    - cron: '0 0,3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ GITHUB_TOKEN으로 커밋하면 저장소 활동으로 인정되지 않아
          # 60일 뒤 cron이 자동 비활성화될 수 있다 (계획서 §5-③).
          # PAT를 DATA_PAT 시크릿에 넣어두면 그 경로를 피한다.
          token: ${{ secrets.DATA_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 의존성 설치
        run: pip install -r batch/requirements.txt

      - name: 유닛 테스트
        working-directory: batch
        run: python -m pytest -q

      - name: 데이터 수집 (증분)
        working-directory: batch
        # 검증 실패 시 build.py가 exit 1 → 이 스텝이 빨갛게 죽는다.
        # 빈 파일을 성공으로 배포하는 일은 없다.
        #
        # --max-stores로 한 번에 받는 양을 묶는다. 상한 없이 돌렸더니 백필
        # 잔량 503회차를 한 번에 긁다가 14분 만에 죽었다(run #1). 이유가 둘이다.
        #   - 요청이 촘촘하게 몰리면 동행복권이 IP를 막는다
        #   - 토요일 cron이 20분 간격이라 실행이 서로 겹친다
        # 백필이 끝나면 신규 회차 1개뿐이라 이 상한은 걸리지 않는다.
        run: python build.py --delay 1.0 --max-stores 120

      - name: 변경분 커밋
        id: commit
        # 수집이 실패해도 커밋한다. collect_stores는 회차를 받는 즉시 파일로
        # 떨어뜨리므로, 도중에 죽어도 그때까지 모은 판매점 캐시는 유효하다.
        # 이걸 버리면 다음 실행이 같은 지점에서 또 죽어 백필이 영영 안 끝난다.
        # 검증 실패 시에는 write_outputs가 아예 호출되지 않으므로
        # draws.json·manifest.json은 손대지 않는다 — 잘못된 배포는 여전히 막힌다.
        if: always()
        run: |
          git config user.name  "lotto-data-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음 — 신규 회차가 아직 없는 것으로 보인다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M) 갱신"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # 추첨일에는 20분마다 도므로, 예약 실행은 바뀐 게 있을 때만 배포한다.
  #
  # 다만 수동 실행(workflow_dispatch)은 변경이 없어도 배포한다.
  # 이 조건만 두면 'Pages가 이미 최신'이라고 전제하게 되는데, 배포가 한 번도
  # 성공한 적이 없거나 중간에 실패했다면 데이터가 바뀔 때까지 404가 방치된다.
  # 실제로 run #2가 그렇게 건너뛰어졌다. 수동 실행을 복구 수단으로 남겨둔다.
  deploy:
    needs: update
    if: >-
      needs.update.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data
      - id: deploy
        uses: actions/deploy-pages@v4
